<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#285d62" />
    <meta name="description" content="A map quiz about where the apostles, Mark, and Paul served." />
    <title>Disciples Map Quiz</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <div class="panel-header">
          <h1>Disciples Map Quiz</h1>
          <button id="closePanelBtn" class="panel-close" aria-label="Close quiz panel">×</button>
        </div>
        <div id="progress">Loading...</div>
        <div id="prompt">—</div>
        <div id="controls">
          <button id="nextBtn" disabled>Next</button>
          <button id="retryBtn" disabled>Retry</button>
          <button id="revealBtn">Reveal Answer</button>
          <button id="showAllBtn">Hint</button>
          <button id="tutorialBtn">Presenter Tutorial</button>
        </div>
        <div id="feedback"></div>
        <div id="score">Score: 0 / 0</div>
      </aside>
      <main id="mapwrap">
        <div id="map"></div>
        <div class="compass-rose" aria-hidden="true"><span>N</span></div>
        <button id="openPanelBtn" class="panel-open" aria-label="Open quiz panel">Open Quiz</button>
      </main>
    </div>

    <div id="summary" class="summary-backdrop" hidden>
      <section class="summary-card" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
        <div class="summary-heading">
          <div>
            <span class="summary-kicker">Journey explained</span>
            <h2 id="summaryTitle">About this journey</h2>
          </div>
          <button id="closeSummaryBtn" class="summary-close" aria-label="Close journey description">×</button>
        </div>
        <p id="summaryText"></p>
        <a id="summarySource" href="https://suscopts.org/diocese/bishop/bible-study" target="_blank" rel="noreferrer">Read the source study</a>
        <button id="continueSummaryBtn" class="summary-continue">Return to map</button>
      </section>
    </div>

    <div id="tutorial" class="tutorial-backdrop" hidden>
      <section class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
        <div class="tutorial-heading">
          <div>
            <span id="tutorialKicker">Presenter guide</span>
            <h2 id="tutorialTitle">Welcome your group</h2>
          </div>
          <button id="closeTutorialBtn" class="tutorial-close" aria-label="Close tutorial">×</button>
        </div>
        <div id="tutorialBody"></div>
        <div class="tutorial-footer">
          <span id="tutorialProgress">Step 1 of 5</span>
          <div>
            <button id="tutorialBackBtn" disabled>Back</button>
            <button id="tutorialNextBtn">Next</button>
          </div>
        </div>
      </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
